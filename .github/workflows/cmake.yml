name: cmake

on:
  # Push-only, on every branch. This fork takes same-repo PRs exclusively, and
  # GitHub surfaces a branch's push checks on the PR opened from that branch, so
  # a pull_request trigger only duplicates every run on PR branches.
  #
  # '**' rather than '*': in GitHub filter patterns '*' does not match '/', so
  # '*' would silently skip every dusk/... branch this fork works on.
  push:
    branches:
      - '**'
  workflow_dispatch:

# One run per branch at a time: pushing again supersedes the previous run, which is otherwise left
# building a commit nobody is waiting on. main is exempt, so every state that lands there is proven
# even when merges arrive back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job here only builds, so nothing needs write access to the repository. Uploading the
# msvc-win64 artifact does not either: actions/upload-artifact uses the Actions runtime token
# rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Whether this push has to build and test at all, which every other job waits for: see
  # .github/code-changed.sh.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        # the history and main to diff against, without the contents of every old file
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - id: check
      env:
        BEFORE: ${{ github.event.before }}
      run: .github/code-changed.sh >> "$GITHUB_OUTPUT"

  ubuntu-22-04:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        # No linux-arm64 / linux-armhf here: arm64 is built natively by the
        # ubuntu-arm job below (see the rationale there), and this fork ships
        # arm64 only — there is no 32-bit ARM (armhf) product to build.
        # linux-i686 dropped for the same reason: no 32-bit Linux product.
        #
        # pluginval dropped: replaced by the self-contained plugin-validation
        # job in wayland.yml. The action's `pluginval` target wgets the KXStudio
        # repository package from launchpad.net and installs carla-git, lv2lint
        # and the mod/darkglass LV2 extensions from it — third-party infra this
        # fork does not want to depend on, and the single flakiest step on the
        # board (launchpad times out regularly). The replacement job installs
        # Tracktion pluginval from a pinned, checksummed GitHub release and
        # everything else from the Ubuntu archives.
        #
        # win32/win64 dropped: those are MinGW cross-builds, and Windows ships
        # from MSVC (see msvc-win64 below). Building the same target with a
        # second toolchain proved portability we do not depend on.
        target: [linux-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Somebody else's action, so its owner and its input names keep their own
      # spelling, and it is pinned to a commit rather than to the moving v1 tag:
      # an upstream rebase must not change what this CI runs.
      - uses: distrho/dpf-cmake-action@c5786bfc026771e312cf0b3ce02d13a5a1cc0a0c # v1
        with:
          dpf_path: .
          suffix: _22_04
          target: ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # DGL_BACKEND=both (dgl/src/runtime-backend.md) through CMake: every library
  # and example with X11 and Wayland compiled into DGL, then an out-of-tree
  # project that consumes DAF the way an application does
  # (tests/runtime-backend-consumer) and opens its window. There is only an X
  # server here; wayland.yml runs the Wayland side under a headless compositor.
  #
  # Inline steps rather than dpf-cmake-action, which has no way to pass a
  # configure option. The packages are the action's linux-x86_64 set (as in
  # ubuntu-arm below), plus the Wayland client libraries and EGL, and Xvfb and
  # Mesa's software rasterizer for the consumer's window.
  # ---------------------------------------------------------------------------
  runtime-backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            build-essential cmake pkg-config gperf \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libglib2.0-dev \
            liblo-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
            libegl-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dri xvfb
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDGL_BACKEND=both | tee configure.log
          grep -q 'DGL windowing backend: X11 and Wayland, chosen at runtime' configure.log \
            || { echo "::error::DGL_BACKEND=both did not select the runtime backend"; exit 1; }
      - name: Build
        run: cmake --build build -j "$(nproc)"
      # what reaches Wayland, the vendored wl_*_interface objects among it, stays inside whatever links DGL
      - name: Verify DGL hides what reaches Wayland
        run: |
          libs=$(find build -name 'libdgl-*.a')
          [ -n "$libs" ] || { echo "::error::no DGL library was built"; exit 1; }
          # shellcheck disable=SC2086
          exported=$(readelf -sW $libs | awk '$7 != "UND" && $5 == "GLOBAL" && $6 == "DEFAULT" {print $8}' \
                     | grep -E '^(wl_|xkb_|egl|dgl_)' || true)
          if [ -n "$exported" ]; then
            echo "::error::DGL leaves these visible: ${exported//$'\n'/ }"
            exit 1
          fi
      - name: Out-of-tree consumer
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          cmake -S tests/runtime-backend-consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DDGL_BACKEND=both
          cmake --build build-consumer -j "$(nproc)"
          xvfb-run -a ctest --test-dir build-consumer --output-on-failure
      # A both build loads the Wayland libraries when it first tries Wayland, so an application linking it
      # must not need them to start.
      - name: Verify the consumer does not link the Wayland libraries
        run: |
          readelf -d build-consumer/runtime-backend-consumer | grep NEEDED
          if readelf -d build-consumer/runtime-backend-consumer | grep -E 'NEEDED.*(libwayland|libxkbcommon|libEGL)'; then
            echo "::error::the consumer links a library a both build should load at runtime"
            exit 1
          fi

  # No ubuntu-24-04 job: 22.04 is the product glibc floor, and a newer-toolchain
  # canary above it is not a configuration anything is shipped on. build.yml
  # dropped its own 24.04 leg for the same reason, so there is no canary left
  # here to defer to either.

  # ---------------------------------------------------------------------------
  # Linux arm64, built NATIVELY on GitHub's ARM runners.
  #
  # This replaces the old `linux-arm64` / `linux-armhf` matrix entries above,
  # which cross-compiled on x86_64 runners. dpf-cmake-action's cross setup does
  # `dpkg --add-architecture arm64`, keeps amd64 pinned to archive.ubuntu.com,
  # and adds ports.ubuntu.com for the :arm64 packages. Multiarch requires the
  # amd64 and :arm64 halves of a package at the *same* version, but the two
  # archives publish on independent schedules — every time they drift, apt
  # cannot satisfy the version-locked -dev packages and aborts with "held broken
  # packages", reddening an otherwise clean commit. Native arm64 runners
  # (ubuntu-*-arm, free for public repos) resolve everything from ports alone,
  # so the two archives can never disagree: the failure class is gone, and the
  # qemu-user-static emulation step goes with it.
  #
  # armhf is not carried over: this fork ships arm64 only (no 32-bit ARM
  # product), and GitHub offers no armhf runner.
  #
  # Scope: this is a build check. Making arm64 binaries *loadable* on older
  # distros is a glibc-floor packaging concern, handled in the product repos by
  # building inside an older-glibc container — deliberately not done here.
  #
  # Why inline steps instead of `uses: distrho/dpf-cmake-action`: the action's
  # native (`linux-x86_64`) dependency and build steps are arch-neutral and are
  # reproduced verbatim below, but its "Fix GitHub's mess (ubuntu-24.04)" step
  # runs for *every* Linux target regardless of arch and rewrites
  # /etc/apt/sources.list.d/ubuntu.sources with `Architectures: amd64 i386`. On
  # an arm64 runner that points apt at architectures ports.ubuntu.com does not
  # serve, so `apt-get update` 404s and the step dies before any build happens.
  # ---------------------------------------------------------------------------
  ubuntu-arm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Single runner, so no matrix (and no fail-fast knob) to carry: 22.04-arm is
    # the product glibc floor, and 24.04-arm only rebuilt the same sources
    # against a newer libc.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup dependencies (native arm64)
        # ports.ubuntu.com (the arm64 archive) is under-resourced and regularly
        # unreachable from GitHub's ARM runners on both IPv6 and IPv4. Swap it
        # for a high-bandwidth mirror (MIT), force IPv4, and retry, so a mirror
        # hiccup doesn't fail CI. Package list matches the action's
        # linux-x86_64 setup step, plus the toolchain bits explicitly.
        run: |
          sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) \
            -exec sed -i 's|ports.ubuntu.com|mirrors.mit.edu|g' {} +
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          ok=0
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -yqq \
              build-essential cmake pkg-config gperf \
              libasound2-dev libdbus-1-dev libgl1-mesa-dev libglib2.0-dev \
              liblo-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
              && { ok=1; break; }
            echo "apt attempt $i failed; retrying in 20s"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "apt failed after 3 attempts"; exit 1; }
      - name: Configure
        # Same in-tree invocation the action uses for linux-x86_64: its
        # CMAKE_EXTRA_ARGS for a non-debug, non-LTO build plus its static
        # libgcc/libstdc++ LDFLAGS. No cross/emulator/VST3-arch overrides —
        # CMake detects aarch64 natively.
        env:
          LDFLAGS: -static-libgcc -static-libstdc++
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
              -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_MODULE_LINKER_FLAGS="${LDFLAGS}" \
              -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}" \
              .
      - name: Build
        run: make -j $(nproc)
      - name: Show built files
        run: ls -l bin/

  # No macos-13 or macos-14 job: GitHub is deprecating the 13 image, and
  # macos-15 covers the newer-SDK risk that 14 merely duplicated.
  # Universal binaries cover the arm64 slice we ship (and the x86_64 one for
  # free). macos-intel and macos-10.15 dropped: both target Intel Macs, which
  # nothing here is shipped for.
  #
  # Inline steps rather than dpf-cmake-action, which configures for macOS 10.12
  # and has no input to change that: this builds for DAF's own default
  # deployment target (11.0, see Makefile.base.mk), as the plugins ship. The
  # steps are otherwise the action's: Homebrew's cairo removed so that nothing
  # links it, a universal Release build, and the bundles packaged.
  macos-15:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove Homebrew cairo
        run: brew uninstall --ignore-dependencies -f cairo
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build all
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"
      - name: Package bundles
        run: ./utils/package-osx-bundles.sh
      # the script writes the per-format packages and the product installer to build/, next to bin/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/*.pkg
          if-no-files-found: error

  # The only Windows leg: products ship MSVC x64. 32-bit and Windows-on-ARM
  # were dropped with the targets nothing is shipped for.
  msvc-win64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - name: Configure CMake
      run: |
       cmake -S . -B build -G"Visual Studio 17 2022" -A"x64" -DCMAKE_BUILD_TYPE="Release"
    - name: Build all
      working-directory: build
      run: cmake --build . --config "Release" -j 2
    - name: Test native OLE file payload
      run: |
       cmake -S tests/native-file-drag -B build-file-drag -G"Visual Studio 17 2022" -A"x64"
       cmake --build build-file-drag --config Release
       ctest --test-dir build-file-drag -C Release --output-on-failure
    - name: Show built files
      working-directory: build/bin
      run: tree
    - uses: actions/upload-artifact@v4
      with:
        name: msvc-win64
        path: build/bin/


  # The one check of this workflow that main's ruleset requires. It passes when every job above
  # passed, or was skipped because .github/code-changed.sh found nothing to build. A job added to
  # this workflow must be added to needs here as well, or nothing requires it.
  cmake-passed:
    needs: [changes, ubuntu-22-04, runtime-backend, ubuntu-arm, macos-15, msvc-win64]
    # Reports also when a job above failed or the run was cancelled, rather than being skipped: a
    # required check counts a skipped job as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check the result of every job above
      env:
        CODE: ${{ needs.changes.outputs.code }}
        NEEDS: ${{ toJSON(needs) }}
      run: |
        failed=$(jq -r --arg code "$CODE" 'to_entries[]
          | select(.value.result != "success" and (.value.result != "skipped" or $code != "false"))
          | "\(.key): \(.value.result)"' <<<"$NEEDS")
        if [ -n "$failed" ]; then
          echo "::error::Not every job passed: ${failed//$'\n'/, }"
          exit 1
        fi

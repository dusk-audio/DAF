name: build

on:
  # Push-only, on every branch. This fork takes same-repo PRs exclusively, and
  # GitHub surfaces a branch's push checks on the PR opened from that branch, so
  # a pull_request trigger only duplicates every run on PR branches.
  #
  # '**' rather than '*': in GitHub filter patterns '*' does not match '/', so
  # '*' would silently skip every dusk/... branch this fork works on.
  push:
    branches:
      - '**'
  workflow_dispatch:

# One run per branch at a time: pushing again supersedes the previous run, which is otherwise left
# building a commit nobody is waiting on. main is exempt, so every state that lands there is proven
# even when merges arrive back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job here only builds and runs tests, so nothing needs write access to the repository.
permissions:
  contents: read

jobs:
  # Whether this push has to build and test at all, which every other job waits for: see
  # .github/code-changed.sh.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
    - uses: actions/checkout@v4
      with:
        # the history and main to diff against, without the contents of every old file
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false
    - id: check
      env:
        BEFORE: ${{ github.event.before }}
      run: .github/code-changed.sh >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os:
          # Only what ships: macOS on Apple Silicon (macos-15) and the Linux
          # product floor. macos-13/14 were deprecated images duplicating
          # macos-15, and ubuntu-24.04 was a newer-toolchain canary above the
          # floor rather than a configuration anything is shipped on.
          - macos-15
          # webgui failure
          # - ubuntu-20.04
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up dependencies
      if: ${{ runner.os == 'Linux' }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq libasound2-dev libcairo2-dev libdbus-1-dev libgl1-mesa-dev liblo-dev libpulse-dev libsdl2-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev xvfb
    - name: Set num jobs
      if: ${{ runner.os == 'Linux' }}
      run: echo "JOBS=$(nproc)" >> $GITHUB_ENV
    - name: Set num jobs
      if: ${{ runner.os != 'Linux' }}
      run: echo "JOBS=$(sysctl -n hw.logicalcpu)" >> $GITHUB_ENV
    - name: Without any warnings
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror
      run: |
        make clean >/dev/null
        make -j ${{ env.JOBS }}
    - name: Build widget gallery
      run: make -C widgets/tests -j ${{ env.JOBS }}
    # -noreset: a lone Xvfb resets whenever its last client disconnects, and refuses the odd connection made
    # during the reset, which the Window tests' back-to-back windows run into
    - name: Run tests
      if: ${{ runner.os == 'Linux' }}
      run: |
        xvfb-run -s "-screen 0 1280x1024x24 -noreset" make -C tests run
    - name: ImGui modifier focus regression
      if: ${{ runner.os == 'Linux' }}
      env:
        LIBGL_ALWAYS_SOFTWARE: 1
      run: |
        cmake -S tests/imgui-focus -B build/imgui-focus -DCMAKE_CXX_STANDARD=11
        cmake --build build/imgui-focus -j6
        xvfb-run -a ctest --test-dir build/imgui-focus --output-on-failure
    - name: Cocoa retired-view regression
      if: ${{ runner.os == 'macOS' }}
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror
      run: |
        make -C tests ../build/tests/CocoaRetiredView USE_WEB_VIEW=false -j5
        ./build/tests/CocoaRetiredView
    - name: AU wrapper and sidechain-on-mono-main regressions
      if: ${{ runner.os == 'macOS' }}
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror
      run: |
        make -C tests ../build/tests/AUWrapper ../build/tests/AUSidechainLayout USE_WEB_VIEW=false -j5
        ./build/tests/AUWrapper
        ./build/tests/AUSidechainLayout
    # gnu++98 dropped: this fork's C++ floor is C++11 (std::atomic in the CLAP wrapper)
    - name: As C++11 mode
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror -std=gnu++11
      run: |
        make clean >/dev/null
        make -j ${{ env.JOBS }}
    - name: As C++20 mode
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror -std=gnu++20
      run: |
        make clean >/dev/null
        make -j ${{ env.JOBS }}
    - name: Custom namespace
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror -DDAF_NAMESPACE=WubbWubb -DDGL_NAMESPACE=DabDab
      run: |
        make clean >/dev/null
        make -j ${{ env.JOBS }}
    - name: With UI_TYPE=opengl3
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror
      run: |
        make clean >/dev/null
        env UI_TYPE=opengl3 make -j ${{ env.JOBS }} -C examples/Parameters jack

  # DGL_BACKEND=both: X11 and Wayland compiled into the same DGL, one of them picked when a world opens
  # (dgl/src/runtime-backend.md). Under xvfb-run there is an X server and no compositor, so the tests
  # here cover the X11 half, RuntimeBackend checking that it is the one picked. wayland.yml runs the
  # Wayland half, and both servers at once, under a headless Weston.
  runtime-backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    # read by every make below, the recursive ones included
    env:
      DGL_BACKEND: both
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    # The build job's packages, plus the Wayland client libraries and EGL the second backend needs, and the
    # dbus-daemon RuntimeBackendWindow runs a stand-in file chooser portal on
    - name: Set up dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yq dbus libasound2-dev libcairo2-dev libdbus-1-dev libegl-dev libgl1-mesa-dev liblo-dev libpulse-dev libsdl2-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxkbcommon-dev libxrandr-dev xvfb
    - name: Show detected features
      run: |
        make features | tee features.txt
        grep -qx 'DGL_RUNTIME_BACKEND: Yes' features.txt \
          || { echo "::error::DGL_BACKEND=both did not select the runtime backend"; exit 1; }
    - name: Without any warnings
      env:
        CFLAGS: -Werror
        CXXFLAGS: -Werror
      run: |
        make clean >/dev/null
        make -j "$(nproc)"
    - name: Build widget gallery
      run: make -C widgets/tests -j "$(nproc)"
    # -noreset: a lone Xvfb resets whenever its last client disconnects, and refuses the odd connection made
    # during the reset, which the Window tests' back-to-back windows run into. DAF_TEST_EXPECT_BACKEND makes
    # the runtime backend tests fail, rather than check that nothing opens, should Xvfb not be there.
    - name: Run tests
      env:
        DAF_TEST_EXPECT_BACKEND: x11
      run: |
        set -o pipefail
        xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" make -C tests run | tee tests.log
        grep -q 'RuntimeBackend: program world on x11' tests.log \
          || { echo "::error::RuntimeBackend did not open its window on X11"; exit 1; }
        grep -q 'RuntimeBackendWindow: window on x11' tests.log \
          || { echo "::error::RuntimeBackendWindow did not open its window on X11"; exit 1; }
        grep -q 'RuntimeBackendWindow: the file chosen in the portal reached the x11 window' tests.log \
          || { echo "::error::RuntimeBackendWindow did not get a file through the stand-in portal"; exit 1; }

  # The one check of this workflow that main's ruleset requires. It passes when every job above
  # passed, or was skipped because .github/code-changed.sh found nothing to build. A job added to
  # this workflow must be added to needs here as well, or nothing requires it.
  build-passed:
    needs: [changes, build, runtime-backend]
    # Reports also when a job above failed or the run was cancelled, rather than being skipped: a
    # required check counts a skipped job as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check the result of every job above
      env:
        CODE: ${{ needs.changes.outputs.code }}
        NEEDS: ${{ toJSON(needs) }}
      run: |
        failed=$(jq -r --arg code "$CODE" 'to_entries[]
          | select(.value.result != "success" and (.value.result != "skipped" or $code != "false"))
          | "\(.key): \(.value.result)"' <<<"$NEEDS")
        if [ -n "$failed" ]; then
          echo "::error::Not every job passed: ${failed//$'\n'/, }"
          exit 1
        fi
